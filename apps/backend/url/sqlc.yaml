version: "2"
sql:
  - engine: "postgresql"
    schema: "./internal/adapters/postgresql/migrations"
    queries: "./internal/adapters/postgresql/query.sql"
    gen:
      go:
        package: "repo"
        out: "./internal/adapters/postgresql/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: timestamptz
            go_type:
              import: "time"
              type: "Time"
